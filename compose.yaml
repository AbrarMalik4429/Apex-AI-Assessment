services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB}
    ports:
      - "${LOCAL_DATABASE_BIND}"
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      APP_HOST: ${DOCKER_APP_HOST}
    ports:
      - "${DOCKER_API_BIND}"
    depends_on:
      db:
        condition: service_healthy
volumes:
  booking_data:
