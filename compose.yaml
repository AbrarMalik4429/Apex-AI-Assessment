name: apex-patient-demo
services:
  api:
    build: .
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:?Load frontend/.env with --env-file}
        FRONTEND_FONT_URL: ${FRONTEND_FONT_URL:-}
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
