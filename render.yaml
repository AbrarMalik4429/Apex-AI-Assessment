services:
  - type: web
    name: apex-booking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_ROOT_CERT
        value: certs/supabase-ca.crt
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_URL
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_RESPONSE_MODE
        value: strict
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: DEMO_ENABLED
        value: "false"
